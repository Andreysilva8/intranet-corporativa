spring.application.name=intranet-corporativa
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/intranet_corporativa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ROOT123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

app.storage.documents-path=${DOCUMENTS_STORAGE_PATH:storage/documents}
app.bootstrap.admin-username=${ADMIN_USERNAME:admin}
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@empresa.local}
app.bootstrap.admin-password=${ADMIN_PASSWORD:admin123}
