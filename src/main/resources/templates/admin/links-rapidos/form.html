<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Link rapido')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-area">
        <div th:replace="~{fragments/topbar :: topbar('Link rapido')}"></div>

        <section class="content">
            <header class="page-header">
                <div>
                    <h2 class="page-title" th:text="${modoEdicao} ? 'Editar link rapido' : 'Novo link rapido'">Link rapido</h2>
                    <p class="page-subtitle">Cadastre um atalho para o dashboard.</p>
                </div>
                <a class="btn btn-secondary" th:href="@{/admin/links-rapidos}">Voltar</a>
            </header>

            <form class="card" th:object="${linkRapidoForm}"
                  th:action="${modoEdicao} ? @{/admin/links-rapidos/{id}(id=${linkRapido.id})} : @{/admin/links-rapidos}"
                  method="post">
                <div class="card-body form-grid">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                        <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}">Erro</p>
                    </div>

                    <div class="form-row">
                        <label for="titulo">Titulo</label>
                        <input id="titulo" type="text" th:field="*{titulo}" required>
                        <span class="field-error" th:errors="*{titulo}"></span>
                    </div>

                    <div class="form-row">
                        <label for="url">URL</label>
                        <input id="url" type="text" th:field="*{url}" required>
                        <span class="field-error" th:errors="*{url}"></span>
                    </div>

                    <div class="grid grid-3">
                        <div class="form-row">
                            <label for="categoria">Categoria</label>
                            <input id="categoria" type="text" th:field="*{categoria}">
                        </div>

                        <div class="form-row">
                            <label for="icone">Icone</label>
                            <input id="icone" type="text" th:field="*{icone}">
                        </div>

                        <div class="form-row">
                            <label for="ordemExibicao">Ordem</label>
                            <input id="ordemExibicao" type="number" th:field="*{ordemExibicao}">
                        </div>
                    </div>

                    <label class="check-item">
                        <input type="checkbox" th:field="*{ativo}">
                        <span>Link ativo</span>
                    </label>

                    <div class="actions">
                        <button class="btn btn-primary" type="submit">Salvar</button>
                        <a class="btn btn-secondary" th:href="@{/admin/links-rapidos}">Cancelar</a>
                    </div>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
