<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Links rapidos')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-area">
        <div th:replace="~{fragments/topbar :: topbar('Links rapidos')}"></div>

        <section class="content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <header class="page-header">
                <div>
                    <h2 class="page-title">Links rapidos</h2>
                    <p class="page-subtitle">Atalhos exibidos no dashboard.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/admin/links-rapidos/novo}">Novo link</a>
            </header>

            <div class="table-wrap section" th:if="${pagina.hasContent()}">
                <table>
                    <thead>
                    <tr>
                        <th>Titulo</th>
                        <th>Categoria</th>
                        <th>Ordem</th>
                        <th>Status</th>
                        <th>Acoes</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="linkRapido : ${pagina.content}">
                        <td>
                            <strong th:text="${linkRapido.titulo}">Titulo</strong>
                            <p class="muted" th:text="${linkRapido.url}">URL</p>
                        </td>
                        <td th:text="${linkRapido.categoria ?: '-'}">Categoria</td>
                        <td th:text="${linkRapido.ordemExibicao}">0</td>
                        <td>
                            <span class="badge badge-success" th:if="${linkRapido.ativo}">Ativo</span>
                            <span class="badge badge-danger" th:unless="${linkRapido.ativo}">Inativo</span>
                        </td>
                        <td>
                            <div class="actions">
                                <a class="btn btn-secondary" th:href="@{/admin/links-rapidos/{id}/editar(id=${linkRapido.id})}">Editar</a>
                                <form th:action="@{/admin/links-rapidos/{id}/status(id=${linkRapido.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="hidden" name="ativo" th:value="${!linkRapido.ativo}">
                                    <button class="btn btn-secondary" type="submit" th:text="${linkRapido.ativo} ? 'Inativar' : 'Ativar'">Status</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="empty-state section" th:if="${!pagina.hasContent()}">
                Nenhum link rapido cadastrado.
            </div>
        </section>
    </main>
</div>
</body>
</html>
