<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Nao encontrado')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-area">
        <div th:replace="~{fragments/topbar :: topbar('Nao encontrado')}"></div>

        <section class="content">
            <article class="card">
                <div class="card-body">
                    <span class="badge badge-warning" th:text="${status ?: '404'}">404</span>
                    <h2 class="page-title" th:text="${erro ?: 'Recurso nao encontrado'}">Recurso nao encontrado</h2>
                    <p class="page-subtitle" th:text="${mensagem ?: 'O item solicitado nao foi localizado.'}">Mensagem</p>
                    <div class="actions section">
                        <a class="btn btn-primary" th:href="@{/dashboard}">Dashboard</a>
                    </div>
                </div>
            </article>
        </section>
    </main>
</div>
</body>
</html>
