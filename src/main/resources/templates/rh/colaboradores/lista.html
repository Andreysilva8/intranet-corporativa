<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Colaboradores')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-area">
        <div th:replace="~{fragments/topbar :: topbar('Colaboradores')}"></div>

        <section class="content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <header class="page-header">
                <div>
                    <h2 class="page-title">Colaboradores</h2>
                    <p class="page-subtitle">Cadastro do diretorio corporativo.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/rh/colaboradores/novo}">Novo colaborador</a>
            </header>

            <div class="table-wrap section" th:if="${pagina.hasContent()}">
                <table>
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Departamento</th>
                        <th>Cargo</th>
                        <th>Status</th>
                        <th>Acoes</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="colaborador : ${pagina.content}">
                        <td th:text="${colaborador.nomeCompleto}">Nome</td>
                        <td th:text="${colaborador.emailCorporativo}">email</td>
                        <td th:text="${colaborador.departamento}">Departamento</td>
                        <td th:text="${colaborador.cargo}">Cargo</td>
                        <td>
                            <span class="badge badge-success" th:if="${colaborador.ativo}">Ativo</span>
                            <span class="badge badge-danger" th:unless="${colaborador.ativo}">Inativo</span>
                        </td>
                        <td>
                            <div class="actions">
                                <a class="btn btn-secondary" th:href="@{/colaboradores/{id}(id=${colaborador.id})}">Perfil</a>
                                <a class="btn btn-secondary" th:href="@{/rh/colaboradores/{id}/editar(id=${colaborador.id})}">Editar</a>
                                <form th:action="@{/rh/colaboradores/{id}/status(id=${colaborador.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="hidden" name="ativo" th:value="${!colaborador.ativo}">
                                    <button class="btn btn-secondary" type="submit" th:text="${colaborador.ativo} ? 'Inativar' : 'Ativar'">Status</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="empty-state section" th:if="${!pagina.hasContent()}">
                Nenhum colaborador cadastrado.
            </div>

            <nav class="pagination" th:if="${pagina.totalPages > 1}">
                <a class="btn btn-secondary" th:href="@{/rh/colaboradores(page=${pagina.number > 0 ? pagina.number - 1 : 0},size=${pagina.size})}">Anterior</a>
                <span class="muted" th:text="'Pagina ' + ${pagina.number + 1} + ' de ' + ${pagina.totalPages}">Pagina</span>
                <a class="btn btn-secondary" th:href="@{/rh/colaboradores(page=${pagina.number + 1 < pagina.totalPages ? pagina.number + 1 : pagina.number},size=${pagina.size})}">Proxima</a>
            </nav>
        </section>
    </main>
</div>
</body>
</html>
