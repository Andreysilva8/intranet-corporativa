<!DOCTYPE html>
<html lang="pt-BR" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="topbar" th:fragment="topbar(pageTitle)">
    <div class="topbar-user">
        <button class="btn btn-secondary mobile-nav-toggle" type="button" data-sidebar-toggle aria-label="Abrir menu">
            <span class="btn-icon">=</span>
        </button>
        <h1 class="topbar-title" th:text="${pageTitle}">Intranet</h1>
    </div>

    <div class="topbar-user">
        <span sec:authentication="name">usuario</span>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-secondary" type="submit">
                <span class="btn-icon">S</span>
                <span>Sair</span>
            </button>
        </form>
    </div>
</header>
</body>
</html>
