<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body>
<main class="auth-page">
    <section class="auth-panel">
        <a class="brand" th:href="@{/login}">
            <span class="brand-mark">IC</span>
            <span>Intranet Corporativa</span>
        </a>

        <form class="login-form" th:action="@{/login}" method="post">
            <h1 class="page-title">Entrar</h1>
            <p class="page-subtitle">Acesse os comunicados, documentos e canais internos.</p>

            <div class="alert alert-error" th:if="${param.erro}">Usuario ou senha invalidos.</div>
            <div class="alert alert-success" th:if="${param.logout}">Sessao encerrada com sucesso.</div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-grid">
                <div class="form-row">
                    <label for="username">Usuario</label>
                    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
                </div>

                <div class="form-row">
                    <label for="password">Senha</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>

                <label class="check-item">
                    <input type="checkbox" name="remember-me">
                    <span>Manter conectado</span>
                </label>

                <button class="btn btn-primary" type="submit">
                    <span class="btn-icon">E</span>
                    <span>Entrar</span>
                </button>
            </div>
        </form>
    </section>

    <section class="auth-aside" aria-label="Intranet Corporativa">
        <h1>Informacao certa, pessoas conectadas, trabalho fluindo.</h1>
    </section>
</main>
</body>
</html>
